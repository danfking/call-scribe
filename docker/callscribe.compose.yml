# Full offline call-scribe stack: the app (transcribe / diarize / coach), Ollama for local
# inference, and the TimescaleDB + pgvector memory store. Live capture is NOT here (Windows-only):
# record on a Windows host, drop the .others.wav / .me.wav pair into ./data/recordings, then run the
# app container to transcribe and coach.
#
#   # bring up the dependencies once
#   docker compose -f docker/callscribe.compose.yml up -d coach-db ollama
#   # pull the coach models into the ollama volume (first run only)
#   docker compose -f docker/callscribe.compose.yml exec ollama ollama pull qwen3:4b-instruct
#   # transcribe the latest recording in ./data/recordings
#   docker compose -f docker/callscribe.compose.yml run --rm app transcribe
#
# The app service has no default command: pass a call-scribe verb (transcribe, coach, config).
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: call-scribe:local
    depends_on:
      - coach-db
      - ollama
    volumes:
      # Recordings in, transcripts out. Mounted at the /data/call-scribe subpath, NOT over /data
      # itself: a host bind mount over $HOME breaks .NET's home-directory resolution in the container.
      # On the host these land in ./data/recordings and ./data/transcripts.
      - ./data:/data/call-scribe
      # Settings (Ollama URL, Postgres conn). ConfigPath resolves under LocalApplicationData on Linux.
      - ./callscribe.config.json:/data/.local/share/call-scribe/config.json:ro
      # Persist the downloaded whisper/speaker models across runs.
      - callscribe-models:/data/.local/share/call-scribe/models
    # Run on demand rather than starting with `up`: it is a CLI, not a long-lived service.
    profiles: ["app"]

  ollama:
    image: ollama/ollama:latest
    container_name: callscribe-ollama
    ports:
      - "11434:11434"
    volumes:
      - callscribe-ollama:/root/.ollama
    restart: unless-stopped

  # Mirrors coach-db.compose.yml; kept here so the whole stack comes up from one file.
  coach-db:
    image: timescale/timescaledb-ha:pg17
    container_name: callscribe-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: callscribe
    ports:
      - "5432:5432"
    volumes:
      - callscribe-db-data:/home/postgres/pgdata/data
    restart: unless-stopped

volumes:
  callscribe-db-data:
  callscribe-ollama:
  callscribe-models:
