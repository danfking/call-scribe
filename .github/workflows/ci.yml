name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
      # The default build is net10.0-windows only; build the portable target the Docker image uses
      # so a Windows-only API leak (CA1416 under TreatWarningsAsErrors) is caught here, not at image build.
      - name: Verify portable net10.0 build
        run: dotnet build src/CallScribe/CallScribe.csproj --configuration Release -p:TargetFrameworks=net10.0
